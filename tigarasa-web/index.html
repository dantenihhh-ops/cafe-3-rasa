<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Menu — Tiga Rasa</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="menu" class="has-nav">
  <div class="app">
    <header class="header" id="header"></header>
    <main class="content">
      <div class="card welcome">
        <p id="welcome-text">Selamat Datang di Tiga Rasa</p>
        <span class="tag navy" style="padding:6px 10px">QR AKTIF</span>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Kategori menu"></div>
      <article class="card hero" id="hero"></article>
      <div class="section-title"><h2>Pilihan Meja Populer</h2><span id="menu-count"></span></div>
      <div id="menu-list" style="display:flex;flex-direction:column;gap:14px"></div>
    </main>
    <div class="cart-bar" id="cart-bar" hidden></div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Navigasi utama"></nav>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
