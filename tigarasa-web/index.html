<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Menu — Tiga Rasa</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="menu" class="has-nav">
  <div class="app">
    <header class="header" id="header"></header>
    <main class="content">
      <div class="card welcome">
        <p id="welcome-text">Selamat Datang di Tiga Rasa</p>
        <span class="tag navy" style="padding:6px 10px">QR AKTIF</span>
      </div>
      <div class="section-title">
        <h2>Menu</h2>
        <span id="menu-count"></span>
      </div>
      <div class="filter-bar">
        <div class="chips" id="category-chips" role="group" aria-label="Kategori menu"></div>
        <div class="filter-wrap" id="filter-wrap">
          <button class="filter-btn" id="filter-btn" type="button" aria-haspopup="true" aria-expanded="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
            <span id="filter-label">Filter</span>
          </button>
          <div class="filter-dropdown" id="filter-dropdown" hidden>
            <div class="filter-section-label">Urutkan Harga</div>
            <button class="filter-option" type="button" data-sort="asc">Harga Termurah</button>
            <button class="filter-option" type="button" data-sort="desc">Harga Termahal</button>
            <div class="filter-divider"></div>
            <div class="filter-section-label">Label Menu</div>
            <div id="filter-tag-options"></div>
            <div class="filter-divider"></div>
            <button class="filter-reset" type="button" id="filter-reset">Reset Filter</button>
          </div>
        </div>
      </div>
      <div class="menu-list" id="menu-list"></div>
    </main>
    <div class="cart-bar" id="cart-bar" hidden></div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Navigasi utama"></nav>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
